[package]
name = "nitro-cli"
version = "1.4.3"
authors = ["The AWS Nitro Enclaves Team <aws-nitro-enclaves-devel@amazon.com>"]
edition = "2018"
license = "Apache-2.0"
rust-version = "1.81"

[dependencies]
serde = { version = ">=1.0", features = ["derive"] }
chrono = "0.4"
clap = "~4.5"
inotify = "0.10"
serde_json = "1.0"
nix = "0.26"
log = "0.4"
libc = { version = ">=0.2.69" }
flexi_logger = "0.25"
page_size = "0.6"
signal-hook = "0.3"
ciborium = "0.2"
driver-bindings = { path = "./driver-bindings" }
aws-nitro-enclaves-image-format = "0.5"
eif_loader = { path = "./eif_loader" }
enclave_build = { path = "./enclave_build" }
openssl = "0.10.72"
vsock = "0.5"
vmm-sys-util = "0.15.0"
sha2 = "0.9.5"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
base64 = "0.22"
serde_bytes = "0.11"

lazy_static = "1.4.0"

[build-dependencies]
bindgen = { version=">=0.54" }

[dev-dependencies]
log = "0.4"
num-derive = "0.4"
num-traits = "0.2"
tempfile = "3.19"
warp = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
rcgen = "0.13"
rustls = "0.23"
rustls-pemfile = "2"
tokio-rustls = "0.26"
hyper = { version = "1.4", features = ["full"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[workspace]
members = [".", "samples/command_executer", "driver-bindings", "eif_loader", "enclave_build", "vsock_proxy"]

[features]
default = []
